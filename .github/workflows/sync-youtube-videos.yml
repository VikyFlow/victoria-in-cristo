name: Sync YouTube Videos

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install yt-dlp
        run: python3 -m pip install --user yt-dlp
      - name: Sync latest videos
        run: npm run sync:videos
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync latest YouTube videos"
